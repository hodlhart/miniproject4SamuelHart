{% extends "base.html" %}
{% block body %}
{% if row %}
  <p><a href="{{ url_for('messages') }}">&larr; back to your messages</a></p>
  <h1>#{{ row.id }} — {{ row.title }}</h1>
  <p class="meta">To: {{ row.owner }}</p>
  <p>{{ row.body }}</p>
{% else %}
  <h1>Message not found</h1>
{% endif %}
{% endblock %}
